<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Brand UI Preview</title>
<style>
  html, body { margin: 0; background: #e8eaed; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .stage { display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; align-items: flex-start; }
  .card { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 10px; font-size: 13px; color: #52525b; }
  iframe { border: 0; width: 424px; height: 560px; background: transparent; }
</style>
</head>
<body>
  <div class="stage">
    <div class="card"><h2>Bilibili panel</h2><iframe src="panel-bilibili.html"></iframe></div>
    <div class="card"><h2>YouTube panel</h2><iframe src="panel-youtube.html"></iframe></div>
    <div class="card"><h2>Douyin panel</h2><iframe src="panel-douyin.html"></iframe></div>
    <div class="card"><h2>Bilibili popup</h2><iframe src="popup-bilibili.html"></iframe></div>
    <div class="card"><h2>YouTube popup</h2><iframe src="popup-youtube.html"></iframe></div>
    <div class="card"><h2>Douyin popup</h2><iframe src="popup-douyin.html"></iframe></div>
  </div>
</body>
</html>
