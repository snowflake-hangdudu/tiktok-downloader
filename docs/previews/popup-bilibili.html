<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../../bilibili-downloader/shared/design-system.css">
<link rel="stylesheet" href="../../../bilibili-downloader/popup/popup.css">
</head>
<body data-theme="bilibili">
  <div class="popup">
    <header class="popup-header">
      <img src="../../../bilibili-downloader/icons/icon48.png" width="30" height="30" alt="" class="popup-icon">
      <div class="popup-header-text">
        <h1>下载助手 B站</h1>
        <span class="popup-version">v1.1.12</span>
      </div>
    </header>
    <main class="popup-body">
      <div class="popup-video-card">
        <div class="popup-cover-wrap"><div class="popup-cover-ph"></div></div>
        <div class="popup-video-meta">
          <div class="video-title">预览：工具栏 Popup 打开下载面板（非伪装下载）</div>
          <div class="video-sub">示例页</div>
        </div>
      </div>
      <div class="popup-section">
        <div class="popup-section-head">可用清晰度</div>
        <div class="popup-quality-tags">
          <span class="popup-q-tag">720P</span>
          <span class="popup-q-tag best active">1080P</span>
        </div>
      </div>
      <button type="button" class="popup-btn">打开下载面板</button>
    </main>
    <footer class="popup-footer">
      <div class="popup-footer-actions" style="display:flex;gap:8px;justify-content:center;margin-bottom:8px;">
        <a class="popup-faq" href="#">FAQ</a>
        <a class="popup-feedback" href="#">合作</a>
      </div>
      <div class="popup-footer-line">仅供个人学习</div>
    </footer>
  </div>
</body>
</html>
