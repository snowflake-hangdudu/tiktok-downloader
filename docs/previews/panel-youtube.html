<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../../youtube-downloader/shared/design-system.css">
<link rel="stylesheet" href="../../../youtube-downloader/content/content.css">
<style>
  html, body { margin: 0; background: #dfe3e8; min-height: 100%; }
  #yt-dl-panel { position: static !important; margin: 12px auto; width: 408px; }
  #yt-dl-menu { position: static !important; width: 408px; max-height: 560px; display: flex; flex-direction: column; background: var(--ytd-bg); border: 1px solid var(--ytd-border); border-radius: 10px; box-shadow: var(--ytd-shadow); overflow: hidden; }
  .yt-dl-body { flex: 1; overflow: auto; padding: 12px 16px; }
  .yt-dl-format-pills { display: flex; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<div id="yt-dl-panel-root">
  <div id="yt-dl-panel" data-theme="youtube">
    <div id="yt-dl-menu" class="yt-dl-menu">
      <header class="yt-dl-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <img class="yt-dl-header-icon" src="../../../youtube-downloader/icons/icon48.png" width="30" height="30" alt="">
          <span class="yt-dl-title">YouTube视频下载助手</span>
          <span class="yt-dl-version" style="padding:2px 7px;border-radius:999px;background:#f3f4f6;">v1.0.1</span>
        </div>
        <button class="yt-dl-close" type="button" style="width:28px;height:28px;border:0;background:#f3f4f6;border-radius:6px;">×</button>
      </header>
      <div class="yt-dl-body">
        <div class="yt-dl-video-card">
          <div style="width:96px;height:54px;background:#eceff3;border-radius:6px;flex-shrink:0;"></div>
          <div style="min-width:0;flex:1;">
            <div class="yt-dl-video-title">Preview long YouTube title validating two-line clamp and text hierarchy</div>
            <div class="yt-dl-video-author">Very Long Channel Name That Should Ellipsis</div>
            <div class="yt-dl-video-sub">1.2M views · 3 days ago</div>
          </div>
        </div>
        <div class="yt-dl-section">
          <div class="yt-dl-section-head">清晰度</div>
          <div class="yt-dl-quality-pills">
            <button class="yt-dl-pill" type="button">720p</button>
            <button class="yt-dl-pill active" type="button">1080p</button>
            <button class="yt-dl-pill" type="button">1440p</button>
          </div>
        </div>
        <div class="yt-dl-section yt-dl-format-row">
          <div class="yt-dl-section-head yt-dl-format-label">格式</div>
          <div class="yt-dl-format-pills">
            <span class="yt-dl-pill active">MP4</span>
          </div>
        </div>
        <div class="yt-dl-estimate">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
          <span>预计大小约 85 MB</span>
        </div>
        <button class="yt-dl-btn" type="button">开始下载</button>
        <button class="yt-dl-btn yt-dl-btn-secondary" type="button">取消整队</button>
      </div>
      <footer class="yt-dl-footer" style="padding:10px 16px;border-top:1px solid var(--ytd-border);">
        <div class="yt-dl-footer-links" style="display:flex;flex-wrap:wrap;gap:6px;">
          <a class="yt-dl-faq-link" href="#">公告</a>
          <a class="yt-dl-faq-link" href="#">开发合作</a>
          <a class="yt-dl-faq-link" href="#">常见问题</a>
          <a class="yt-dl-privacy-link" href="#">隐私政策</a>
          <a class="yt-dl-feedback" href="#">反馈邮箱：hangdudu0@agent.qq.com</a>
        </div>
      </footer>
    </div>
  </div>
</div>
</body>
</html>
