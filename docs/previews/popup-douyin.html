<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../../douyin-downloader/shared/design-system.css">
<link rel="stylesheet" href="../../../douyin-downloader/popup/popup.css">
</head>
<body data-theme="douyin">
  <div class="popup">
    <header class="popup-header">
      <img src="../../../douyin-downloader/icons/icon48.png" width="30" height="30" alt="" class="popup-icon">
      <div class="popup-header-text">
        <h1>抖音视频下载助手</h1>
        <span class="popup-version">v1.2.0</span>
      </div>
    </header>
    <main class="popup-body">
      <div class="popup-video-card">
        <div class="popup-cover-wrap"><div class="popup-cover-ph"></div></div>
        <div class="popup-video-meta">
          <div class="video-title">预览：深蓝黑主按钮，青粉仅 Header 细线</div>
          <div class="video-sub">douyin.com</div>
        </div>
      </div>
      <div class="popup-section">
        <div class="popup-section-head">可用清晰度</div>
        <div class="popup-quality-tags">
          <span class="popup-q-tag">标清</span>
          <span class="popup-q-tag best active">高清</span>
        </div>
      </div>
      <button type="button" class="popup-btn">打开下载面板</button>
    </main>
    <footer class="popup-footer">
      <div class="popup-footer-actions" style="display:flex;gap:8px;justify-content:center;margin-bottom:8px;">
        <a class="popup-faq" href="#">FAQ</a>
        <a class="popup-feedback" href="#">合作</a>
      </div>
    </footer>
  </div>
</body>
</html>
